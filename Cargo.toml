[workspace]
resolver = "2"

members = [
    "crates/domain",
    "crates/application",
    "crates/ports",
    "crates/infrastructure",
]

exclude = [
    "apps/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
